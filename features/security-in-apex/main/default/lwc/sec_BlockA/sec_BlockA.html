<template>
    <lightning-card title="Record-Level Access (Sharing Keywords)" icon-name="standard:account">
        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <div class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                <p class="slds-m-bottom_xx-small">Don't assign any Permission Set to demo user(No access to Account obj) and see the difference by changing the API version to 67.0:</p>
                <ul class="slds-list_dotted">
                    <li><strong>Before 67.0:</strong> Apex runs in system mode, so the user is able to see the records.</li>
                    <li><strong>From 67.0:</strong> Apex runs in user mode, so it checks the user's permissions and applies Object/Field access.</li>
                </ul>
            </div>
            <lightning-button
                label="Re-run all queries"
                variant="brand"
                onclick={runAll}
                class="slds-m-top_small">
            </lightning-button>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Running..." size="small"></lightning-spinner>
        </template>

        <template for:each={results} for:item="r">
            <div key={r.label} class="slds-p-around_small slds-p-horizontal_medium">
                <div class="slds-box slds-theme_default">
                    <p class="slds-text-heading_small">{r.label}</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">{r.explanation}</p>

                    <template if:true={r.error}>
                        <p class="slds-text-color_error">Error: {r.error}</p>
                    </template>

                    <template if:false={r.error}>
                        <p class="slds-m-bottom_x-small"><strong>{r.count}</strong> record(s) returned</p>
                        <lightning-datatable
                            key-field="Id"
                            data={r.records}
                            columns={columns}
                            hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
